title: DNS Query to Known LummaC2 C2 Domain
id: b2c3d4e5-f6a7-8901-bcde-f12345678901
status: experimental
description: |
    Detects DNS queries to domains associated with the LummaC2 infostealer
    malware. The domain list is dynamically extracted from CISA advisory
    AA25-141B using ioc-finder and injected into this rule at runtime via
    RSigma's dynamic pipeline sources.
author: Mostafa Moradian
date: 2026-05-10
references:
    - https://www.cisa.gov/news-events/cybersecurity-advisories/aa25-141b
    - https://github.com/mostafa/rsigma
tags:
    - attack.command_and_control
    - attack.t1071.001
logsource:
    category: dns
detection:
    selection:
        query|endswith: "%advisory_domains%"
    condition: selection
falsepositives:
    - Unlikely, domains are typosquatted and purpose-built for C2
level: high
